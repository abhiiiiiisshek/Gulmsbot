name = "gulmsbot"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

# every 10 min: fresh deadline copy (fast first tap), pinned live dashboard, snooze wake-ups, review nudge, health checks
[triggers]
crons = ["*/10 * * * *"]

# run the Worker close to the services it talks to most (the LMS) — cuts round-trip time
[placement]
mode = "smart"
